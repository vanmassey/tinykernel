name: Build and boot test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86
      - name: Clean build
        run: make clean && make
      - name: Boot test
        run: make check
