name: Kernel build

on:
  push:
    branches: ["main", "security-corrections"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install compiler tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make
      - name: Build tinykernel
        run: make CC=clang LD=ld.lld
