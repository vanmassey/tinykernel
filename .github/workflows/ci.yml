name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld make qemu-system-x86

      - name: Build
        run: make CC=clang LD=ld.lld

      - name: Boot smoke test
        run: make CC=clang LD=ld.lld check
